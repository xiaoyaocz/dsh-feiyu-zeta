# dsh-feiyu-zeta bundle patch
#
# 当本包通过 DSH 插件管理器安装后，
# dsh 启动时自动加载此 patch。
#
# 环境变量：
#   QQBOT_APPID  - QQ Bot AppID（必填）
#   QQBOT_SECRET - QQ Bot AppSecret（必填）
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch

# 在原生Schedule初始化前完成迁移任务恢复；后续完全委托原生服务。
# patch 的 name 只负责匹配，不能替换模块，因此停用原行并插入包装入口。
- id: schedule
  name: '@deepseek-ai/dsh-schedule'
  disabled: true

- insert:
    - id: zeta-schedule-bridge
      name: 'dsh-feiyu-zeta/schedule-bridge'

# ── 插入 im-qqbot 插件行 ──
- insert:
    - id: im-qqbot
      name: 'dsh-feiyu-zeta'
      config:
        appId: __FROM_ENV__
        appSecret: __FROM_ENV__
        # provider/model 留空：从宿主默认模型路由继承
        # 用户可通过 /model 命令在聊天中切换
        requireMention: true
        textChunkLimit: 4500
        sessionIdleTimeout: 1800000
        maxQueue: 20
        processingTimeoutMs: 1800000
        historyLimit: 10
        access:
          c2cMode: open
          c2cAllow: []
          groupMode: open
          groupAllow: []
        debug: false
